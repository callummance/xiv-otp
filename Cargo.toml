[package]
name = "xiv-otp"
version = "0.1.0"
edition = "2024"

[lib]
name = "xiv_otp"
path = "src/lib.rs"

[[bin]]
name = "xiv-otp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.12.0"
futures = "^0.3.33"
oo7 = { version = "0.6.0", features = ["tracing"] }
procfs = "0.18.0"
reqwest = "0.13.4"
tokio = "1.53.1"
tokio-stream = "0.1.19"
totp-rs = { version = "6.0.0", features = ["otpauth", "zeroize"] }
tracing = "0.1.44"
tracing-futures = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
zeroize = "1.9.0"
